version: '3.8'

services:
  # ----------------------------------------------------
  # DATABASES & STORAGE
  # ----------------------------------------------------
  postgres:
    image: ankane/pgvector:latest
    container_name: prism-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: prism-neo4j
    env_file: .env
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
      - ./data/neo4j/import:/var/lib/neo4j/import
      - ./data/neo4j/plugins:/plugins
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: prism-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: prism-minio
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: prism-mlflow
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root s3://mlflow/ --host 0.0.0.0
    restart: unless-stopped

  # ----------------------------------------------------
  # APPLICATION SERVICES (Placeholders for development)
  # ----------------------------------------------------
  api:
    image: python:3.11-slim
    container_name: prism-api
    env_file: .env
    working_dir: /app
    volumes:
      - ./apps/api:/app
    # Command keeps the container alive for development before the actual app is built
    command: tail -f /dev/null
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - neo4j
      - redis

  worker:
    image: python:3.11-slim
    container_name: prism-worker
    env_file: .env
    working_dir: /app
    volumes:
      - ./apps/worker:/app
    command: tail -f /dev/null
    depends_on:
      - redis
      - postgres

  network-engine:
    image: rust:1.75
    container_name: prism-network-engine
    working_dir: /app
    volumes:
      - ./services/network-engine:/app
    command: tail -f /dev/null

  frontend:
    image: node:20
    container_name: prism-frontend
    working_dir: /app
    volumes:
      - ./apps/web:/app
    command: tail -f /dev/null
    ports:
      - "3000:3000"
